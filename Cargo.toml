[package]
name = "lindirstat"
version = "0.1.0"
edition = "2021"

[lib]
name = "lindirstat"
path = "src/lib.rs"

[[bin]]
name = "lindirstat"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
rayon = "1.10"
crossbeam-channel = "0.5"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.15"
open = "5.3"
trash = "5.2"

[dev-dependencies]
tempfile = "3"
