name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build Linux Release (AppImage & tar.gz)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfuse2 \
            file \
            appstream

      - name: Run test suite
        run: cargo test --release

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v$(grep -m1 '^version' Cargo.toml | awk -F '"' '{print $2}')"
          fi
          # Strip leading 'v' for numeric version
          CLEAN_VERSION="${VERSION#v}"
          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=${VERSION}" >> $GITHUB_ENV
          echo "Building version: ${CLEAN_VERSION} with tag: ${VERSION}"

      - name: Build Packages (.AppImage & .tar.gz)
        run: |
          ./scripts/build-packages.sh "${{ env.VERSION }}"

      - name: Upload Build Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: lindirstat-${{ env.TAG_NAME }}-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: LinDirStat ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS.txt


